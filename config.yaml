# ============ 向量数据库配置 ============
#collection_name: langchain
#persist_directory: ./chroma_db

#语义分块配置
#persist_directory: ./chroma_db_experiments/semantic_v3
#collection_name: langchain_semantic_v3
#chunk_strategy: semantic
#chunk_schema_version: v3

#混合结构语义分块 + 视觉摘要实验库
persist_directory: ./chroma_db_experiments/vision_v1
collection_name: langchain_vision_v1
chunk_strategy: hybrid_section_semantic
chunk_schema_version: v4

k: 6                           # 检索返回 TOP-K，论文问答建议 3~5

# ============ 文本分块配置 ============
chunk_size: 500                   # 每个文本块最大字符数
chunk_overlap: 100                # 相邻块重叠字符数（防切断句子）
#chunk_strategy: recursive_character
#chunk_schema_version: v1
index_manifest_filename: index_manifest.json
separators:
  - "\n\n"
  - "\n"
  - "。"
  - "."
  - " "
  - ""

# ============ 论文结构感知分块（实验策略）============
# 可将 chunk_strategy 切换为 section_aware；默认保留 recursive_character 作为 baseline。
section_heading_detection: true
section_min_chars: 120
section_max_chars: 900
preserve_abstract: true
references_policy: keep_with_metadata

# ============ 模型配置 ============
# embedding_model: nomic-embed-text # 嵌入模型（Phase 2 可换 bge-m3）
embedding_model: BAAI/bge-m3
llm_model: qwen2.5:3b               # 默认演示模型（更适合 8GB 显存，主流程优先）
llm_model_reasoning: deepseek-r1:7b  # reasoning 对照模型（需要时切换，用于对比实验）
temperature: 0.1                  # 论文问答越低越好（0~1，越低越确定）
llm_num_ctx: 4096                 # 推荐上下文窗口：8GB 卡上更稳，能显著降低截断风险
llm_num_predict: 1024             # 推荐输出上限：避免长答案被提前截断

# ============ 视觉摘要入库（Vision RAG v1，默认关闭）============
# 仅在 build 阶段调用视觉模型，查询阶段仍走文本 RAG。
enable_vision_analysis: true
vision_model: qwen2.5vl:3b
vision_prompt_version: v1
vision_cache_dir: ./data/vision_cache
vision_force_refresh: false
vision_trigger_policy: forced_only
vision_visual_density_threshold: 0.35
vision_max_pages_per_doc: 20
vision_force_pages: {deepseekr1.pdf: [51]}

# ============ 混合检索权重（Phase 2 启用）============
# 向量权重高 = 重语义 · BM25 权重高 = 重关键词精准匹配
default_vector_weight: 0.5
default_bm25_weight: 0.5

# ============ Rerank 精排（任务4）============
# 只作用于标准 mixed 检索路径；HyDE 路径暂不启用，避免一次叠加多个变量。
enable_rerank: true
reranker_model: ./models/bge-reranker-v2-m3-ms
rerank_top_k: 6

# ============ Query Expansion / Multi-Query（任务5）============
# 仅作用于标准 mixed 检索路径；原始 query 保留，额外生成 query 变体后统一 rerank。
enable_query_expansion: true
query_expansion_model: qwen2.5:3b
query_expansion_variants: 2
query_expansion_max_multiplier: 3

# ============ Context Compression（任务6）============
# 只压缩送入生成 prompt 的上下文，不改变检索结果和前端来源展示。
enable_context_compression: true
context_compression_max_sentences: 3

# ============ Parent Document Retrieval（任务7）============
# 召回 child chunk 后，生成阶段回溯同来源同页 chunks 作为 parent context。
enable_parent_retrieval: true
parent_max_chars_per_page: 2500

# ============ Agentic RAG（LangGraph，默认关闭）============
enable_agentic_query: false
agent_auto_for_complex: true
agent_max_repair_rounds: 1
agent_planner_model: qwen2.5:3b
agent_verifier_model: qwen2.5:3b
agent_verifier_temperature: 0.0
agent_debug_trace: false

# ============ 结构化查询日志（任务9）============
# 记录每次问答的 route、来源、上下文长度和分阶段耗时，便于后续失败分析。
enable_query_logging: true
query_log_path: logs/query_runs.jsonl

# ============ 语义切割阈值（Phase 2 智能分块用）============
semantic_similarity_threshold: 0.7
semantic_min_chars: 180
semantic_max_chars: 900

# ============ PDF 页面跳过（可配置，按文件名关键词匹配）============
# 格式: 文件名关键词: [页码列表]
skip_pages:
  deepseekr1: [78, 79, 80, 81, 82, 83, 84, 85]
  vit: [9, 10, 11]
  t5: [57, 58, 59, 60, 61, 62, 63, 64, 65, 66]
  gpt3: [41, 67, 68, 69, 70, 71, 72, 73, 74]
  bert: [9, 10]
  attention is all you need: [10 ,11]
  1911.07559v2: [7]

